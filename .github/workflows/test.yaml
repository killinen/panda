name: tests

on: [push, pull_request]

# Minimal token scope; artifact actions don't need extra perms for same-run uploads/downloads
permissions:
  contents: read

env:
  RUN: docker run --rm panda /bin/bash -c
  PERSIST: docker run --name panda panda /bin/sh -c
  BUILD: |
    docker pull $(grep -ioP '(?<=^from)\s+\S+' Dockerfile.panda) || true
    docker pull docker.io/commaai/panda:latest || true
    docker build --cache-from docker.io/commaai/panda:latest -t panda -f Dockerfile.panda .

jobs:
  docker_push:
    name: docker push
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request' && github.repository == 'commaai/panda'
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: eval "$BUILD"

      # Safer than inline `docker login -p ...`
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: wmelching
          password: ${{ secrets.COMMA_DOCKERHUB_TOKEN }}

      - name: Tag image
        run: docker tag panda docker.io/commaai/panda:latest

      - name: Push image
        run: docker push docker.io/commaai/panda:latest

  build:
    name: build
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: eval "$BUILD"

      - name: Test python package installer
        run: $RUN "cd /tmp/openpilot/panda && python setup.py install"

      - name: Build panda STM image and bootstub
        run: $RUN 'cd /tmp/openpilot/panda && scons'

      - name: Build pedal STM image and bootstub
        run: $RUN 'cd /tmp/openpilot/panda && PEDAL=1 scons'

  unit_tests:
    name: unit tests
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: eval "$BUILD"

      - name: Test pack/unpack for USB protocol
        run: |
          $RUN "cd /tmp/openpilot/panda/tests/usbprotocol && \
                python -m unittest discover ."

  safety:
    name: safety
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      
      - name: Build Docker image
        run: eval "$BUILD"

      - name: Run safety tests
        run: |
          $RUN 'cd /tmp/openpilot && \
                scons -c && \
                scons -j$(nproc) opendbc/ cereal/ && \
                cd panda/tests/safety && \
                ./test.sh'

  safety_replay:
    name: safety replay
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: eval "$BUILD"

      - name: Run safety replay
        run: |
          $RUN "cd /tmp/openpilot/panda/tests/safety_replay && \
                scons -u --test .. && \
                ./test_safety_replay.py"

  misra:
    name: misra c2012
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: eval "$BUILD"

      - name: Run Misra C 2012 analysis
        run: $PERSIST "cd /tmp/openpilot/panda/tests/misra && ./test_misra.sh"

      - name: Copy analysis outputs
        if: always()
        run: docker cp panda:/tmp/misra /tmp || true

      # 🔁 UPDATED to v4 (no more v2 deprecation)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cppcheck_output
          path: /tmp/misra/cppcheck_*_output.txt
          if-no-files-found: warn
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: misra_output
          path: /tmp/misra/misra_*_output.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Cleanup persisted container
        if: always()
        run: |
          docker rm -f panda || true

  python_linter:
    name: python linter
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: eval "$BUILD"

      - name: Run static analysis
        run: |
          $RUN "cd /tmp/openpilot/panda && git init && git add -A && pre-commit run --all"
